services:
  elasticsearch:
    hostname: ${HOSTNAME_PREFIX}-{{.Task.Slot}}
    environment:
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      cluster.name: ${ES_CLUSTER_NAME:-es_pro}
      xpack.security.http.ssl.key: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Task.Slot}}/${HOSTNAME_PREFIX}-{{.Task.Slot}}.key
      xpack.security.http.ssl.certificate: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Task.Slot}}/${HOSTNAME_PREFIX}-{{.Task.Slot}}.crt
      xpack.security.transport.ssl.key: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Task.Slot}}/${HOSTNAME_PREFIX}-{{.Task.Slot}}.key
      xpack.security.transport.ssl.certificate: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Task.Slot}}/${HOSTNAME_PREFIX}-{{.Task.Slot}}.crt
    deploy:
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '${RESOURCES_LIMITS_CPUS:-2}'
          memory: ${RESOURCES_LIMITS_MEMORY:-4G}
        reservations:
          cpus: '${RESOURCES_RESERVATIONS_CPUS:-0.2}'
          memory: ${RESOURCES_RESERVATIONS_MEMORY:-3G}

volumes:
  elasticsearch-data-vol:
    name: ${DATA_VOL_NAME}-{{.Task.Slot}}
    driver: ${PRO_VOL_DRIVER}
    driver_opts:
      backing: relocatable
      size: ${DATA_VOL_SIZE:-25}
      ebstype: gp3

  elasticsearch-cert-vol:
    driver: ${PRO_VOL_DRIVER}
    driver_opts:
      backing: shared
