services:
  elasticsearch:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    hostname: ${HOSTNAME_PREFIX}-{{.Node.Hostname}}
    environment:
      path.data: ${ES_PATH_DATA}
      node.name: ${HOSTNAME_PREFIX}-{{.Node.Hostname}}
      cluster.initial_master_nodes: ${ES_CLUSTER_INITIAL_MASTER_NODES}
      discovery.seed_hosts: ${ES_DISCOVERY_SEED_HOSTS}
      ELASTIC_PASSWORD:
      bootstrap.memory_lock: ${ES_BOOTSTRAP_MEMORY_LOCK}
      xpack.security.enabled: ${ES_XPACK_SECURITY_ENABLED}
      xpack.security.http.ssl.enabled: ${ES_XPACK_SECURITY_HTTP_SSL_ENABLED}
      xpack.security.http.ssl.client_authentication: ${ES_XPACK_SECURITY_HTTP_SSL_CLIENT_AUTHENTICATION}
      xpack.security.http.ssl.verification_mode: ${ES_XPACK_SECURITY_HTTP_SSL_VERIFICATION_MODE}
      xpack.security.http.ssl.key: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.key
      xpack.security.http.ssl.certificate: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.crt
      xpack.security.http.ssl.certificate_authorities: ${ES_CERT_PATH}/${SSL_CA_CERT_FILEPATH}
      xpack.security.transport.ssl.enabled: ${ES_XPACK_SECURITY_TRANSPORT_SSL_ENABLED}
      xpack.security.transport.ssl.client_authentication: ${ES_XPACK_SECURITY_TRANSPORT_SSL_CLIENT_AUTHENTICATION}
      xpack.security.transport.ssl.verification_mode: ${ES_XPACK_SECURITY_TRANSPORT_SSL_VERIFICATION_MODE}
      xpack.security.transport.ssl.key: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.key
      xpack.security.transport.ssl.certificate: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.crt
      xpack.security.transport.ssl.certificate_authorities: ${ES_CERT_PATH}/${SSL_CA_CERT_FILEPATH}
      xpack.ml.use_auto_machine_memory_percent: ${ES_XPACK_ML_USE_AUTO_MACHINE_MEMORY_PERCENT}
      S3_ACCESS_KEY:
      S3_SECRET_KEY:
    networks:
      elastic-net:
      metric-net:
    volumes:
      - data-vol:${ES_PATH_DATA}
      - cert-vol:${ES_CERT_PATH}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: >
        curl -s -o /dev/null -I -w "%{http_code}" --cacert ${ES_CERT_PATH}/${SSL_CA_CERT_FILEPATH} \
          https://localhost:${INTERNAL_PORT} | grep -q "^${HEALTH_STATUS_CODE}$$"
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-15s}
      retries: ${HEALTHCHECK_RETRIES:-10}
      start_period: ${HEALTHCHECK_START_PERIOD:-5m}
    stop_grace_period: ${STOP_GRACE_PERIOD:-2m}
    deploy:
      mode: replicated
      replicas: ${REPLICAS:-3}
      placement:
        max_replicas_per_node: 1
      endpoint_mode: dnsrr
      restart_policy:
        delay: ${RESTART_DELAY:-5s}
      update_config:
        delay: ${UPDATE_DELAY:-5m}

  es-cert-setup:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    user: "0"
    command: >
      bash -c '
        if [ ! -f ${ES_CERT_PATH}/ca.zip ]
        then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out ${ES_CERT_PATH}/ca.zip;
          if [ ! -f ${ES_CERT_PATH}/ca.zip ]
          then
            echo "CA creation failed";
            exit 1;
          fi;
          unzip ${ES_CERT_PATH}/ca.zip -d ${ES_CERT_PATH};
        else
          echo "Found previous CA, omitting creation";
        fi;
        if [ ! -f ${ES_CERT_PATH}/certs.zip ]
        then
          echo "Creating certs";
          echo "instances:" > ${ES_CERT_PATH}/instances.yml;
          nodeNames=$$(echo "$${ES_CLUSTER_NODES:-${ES_CLUSTER_INITIAL_MASTER_NODES}}");
          for nodeName in $$(echo "$${nodeNames}" | sed "s/,/ /g")
          do
            echo "Detected node name: $${nodeName}";
            echo -ne \
            "  - name: $${nodeName}\n"\
            "   dns:\n"\
            "     - $${nodeName}\n"\
            "     - elasticsearch\n"\
            "     - localhost\n"\
            "   ip:\n"\
            "     - 127.0.0.1\n"\
            >> ${ES_CERT_PATH}/instances.yml;
          done;
          bin/elasticsearch-certutil cert --silent --pem \
            --out ${ES_CERT_PATH}/certs.zip --in ${ES_CERT_PATH}/instances.yml \
            --ca-cert ${ES_CERT_PATH}/${SSL_CA_CERT_FILEPATH} --ca-key ${ES_CERT_PATH}/ca/ca.key;
          if [ ! -f ${ES_CERT_PATH}/certs.zip ]
          then
            echo "Certs creation failed";
            exit 1;
          fi;
          unzip ${ES_CERT_PATH}/certs.zip -d ${ES_CERT_PATH};
        else
          echo "Found previous certs, omitting creation";
        fi;
        echo "Setting file permissions";
        chown -R root:root ${ES_CERT_PATH};
        find ${ES_CERT_PATH} -type d -exec chmod 750 \{\} \;;
        find ${ES_CERT_PATH} -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s -o /dev/null -I -w "%{http_code}" --cacert ${ES_CERT_PATH}/${SSL_CA_CERT_FILEPATH} \
          https://elasticsearch:${INTERNAL_PORT} | grep -q "^${HEALTH_STATUS_CODE}$$"
        do
          sleep 5;
        done;
        echo "Setting ${KIBANA_USER} password";
        if curl -s --cacert ${ES_CERT_PATH}/${SSL_CA_CERT_FILEPATH} -u "elastic:${ELASTIC_PASSWORD}" \
          -X POST -H "Content-Type: application/json" -d "{\"password\":\"${KIBANA_PASS}\"}" \
          https://elasticsearch:${INTERNAL_PORT}/_security/user/${KIBANA_USER}/_password | grep -q "^{}"
        then
          echo "Password set successfully";
        else
          echo "Password set failed";
        fi;
        echo "All done!";
      '
    environment:
      ES_CLUSTER_NODES:
    networks:
      elastic-net:
    volumes:
      - cert-vol:${ES_CERT_PATH}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 128M
        reservations:
          cpus: '0.001'
          memory: 32M

networks:
  elastic-net:
    name: ${ELASTIC_NET_NAME:-elastic-net}
    driver: ${ELASTIC_NET_DRIVER:-overlay}
    attachable: ${ELASTIC_NET_ATTACHABLE:-true}

  metric-net:
    name: ${METRIC_NET_NAME:-metric-net}
    driver: ${METRIC_NET_DRIVER:-overlay}
    external: true
