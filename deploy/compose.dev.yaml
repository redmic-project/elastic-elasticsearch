services:
  elasticsearch:
    hostname: ${HOSTNAME_PREFIX}-{{.Node.Hostname}}
    environment:
      cluster.name: ${ES_CLUSTER_NAME:-es_dev}
      xpack.security.http.ssl.key: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.key
      xpack.security.http.ssl.certificate: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.crt
      xpack.security.transport.ssl.key: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.key
      xpack.security.transport.ssl.certificate: ${ES_CERT_PATH}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}/${HOSTNAME_PREFIX}-{{.Node.Hostname}}.crt
    ports:
      - target: ${INTERNAL_PORT}
        published: ${EXTERNAL_PORT:-9200}
        mode: ${PORT_MODE:-host}
    deploy:
      resources:
        limits:
          cpus: '${RESOURCES_LIMITS_CPUS:-1}'
          memory: ${RESOURCES_LIMITS_MEMORY:-4G}
        reservations:
          cpus: '${RESOURCES_RESERVATIONS_CPUS:-0.1}'
          memory: ${RESOURCES_RESERVATIONS_MEMORY:-2500M}

volumes:
  elasticsearch-data-vol:
    name: ${STACK}_${DATA_VOL_NAME}-{{.Node.Hostname}}
    driver: ${DEV_VOL_DRIVER}

  elasticsearch-cert-vol:
    driver: ${DEV_VOL_DRIVER}
    driver_opts:
      type: ${VOL_TYPE:-nfs}
      o: addr=${VOL_ADDR:-127.0.0.1},vers=${VOL_VERS:-4.2},${VOL_OPTS:-soft,nolock,noacl,noatime,nodiratime}
      device: :${VOL_DEVICE_PREFIX}${CERT_VOL_DEVICE:-/elasticsearch-cert-vol/}
